<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Penhold Posting-Paket</title>
<style>
:root { --gruen:#245a49; --sand:#efe6d2; --creme:#fbf7ee; --tinte:#1d2a24; --leise:#5b665f; --ball:#f2b632; }
@media (prefers-color-scheme: dark) { :root { --sand:#16201b; --creme:#1f2b25; --tinte:#eef2ec; --leise:#a9b5ad; } }
* { box-sizing:border-box; } body { margin:0; background:var(--sand); color:var(--tinte); font:16px/1.45 system-ui,-apple-system,sans-serif; }
main { max-width:560px; margin:0 auto; padding:16px; } h1 { font-size:22px; margin:8px 0 4px; } .stand { color:var(--leise); margin:0 0 16px; font-size:14px; }
.karte { background:var(--creme); border-radius:16px; padding:16px; margin:0 0 16px; }
.kopf { display:flex; justify-content:space-between; gap:8px; font-size:13px; color:var(--leise); }
.marke { font-weight:700; color:#fff; padding:2px 8px; border-radius:99px; } .marke.ig { background:#c13584; } .marke.tt { background:#111; }
h2 { font-size:19px; margin:10px 0 4px; } .hinweis { color:var(--leise); font-size:14px; margin:0 0 10px; }
.medien video, .medien img { width:100%; border-radius:10px; display:block; background:#000; } .medien.raster { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
textarea { width:100%; margin-top:10px; font:14px/1.4 system-ui,sans-serif; border:1px solid var(--leise); border-radius:10px; padding:10px; background:var(--sand); color:var(--tinte); }
.knopf { display:block; width:100%; text-align:center; margin-top:8px; padding:12px; border:0; border-radius:10px; background:var(--gruen); color:#fff; font-weight:700; font-size:16px; text-decoration:none; }
.id { color:var(--leise); font-size:11px; margin:8px 0 0; word-break:break-all; } .leer { color:var(--leise); }
</style></head><body><main>
<h1>Posting-Paket</h1><p class="stand">Stand 09.11. 00:26 · 0 Post(s)</p>
<p class="leer">Gerade nichts zu posten.</p>
</main><script>
document.querySelectorAll('button[data-ziel]').forEach(function (b) { b.addEventListener('click', function () {
  var t = document.getElementById(b.dataset.ziel); var fertig = function () { b.textContent = 'Kopiert'; setTimeout(function () { b.textContent = 'Caption kopieren'; }, 1500); };
  if (navigator.clipboard) { navigator.clipboard.writeText(t.value).then(fertig, function () { t.select(); document.execCommand('copy'); fertig(); }); }
  else { t.select(); document.execCommand('copy'); fertig(); }
}); });
</script></body></html>
